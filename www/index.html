<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#004523" />
    <title>Canopée</title>
    <style>
      @font-face {
        font-family: 'Averia Serif Libre';
        src: url('fonts/averia-700.woff2') format('woff2');
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Museo Sans';
        src: url('fonts/museo-500.otf') format('opentype');
        font-weight: 500;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Museo Sans';
        src: url('fonts/museo-700.otf') format('opentype');
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }

      :root {
        --forest: #004523;
        --green: #17aa55;
        --cream: #f6f4df;
        --lime: #c7de35;
        --sky: #77d0ec;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }

      body {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: var(--forest);
        color: var(--forest);
        font-family:
          'Museo Sans',
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        font-weight: 500;
        -webkit-font-smoothing: antialiased;
        padding: calc(2rem + env(safe-area-inset-top)) 1.5rem
          calc(2rem + env(safe-area-inset-bottom));
      }

      .glow {
        position: absolute;
        border-radius: 9999px;
        pointer-events: none;
      }

      .glow-lime {
        top: -6rem;
        left: -6rem;
        width: 24rem;
        height: 24rem;
        background: rgba(199, 222, 53, 0.2);
        filter: blur(64px);
      }

      .glow-sky {
        right: -8rem;
        bottom: -8rem;
        width: 28rem;
        height: 28rem;
        background: rgba(119, 208, 236, 0.2);
        filter: blur(64px);
      }

      .glow-green {
        top: 33%;
        right: 12%;
        width: 11rem;
        height: 11rem;
        background: rgba(23, 170, 85, 0.25);
        filter: blur(40px);
      }

      .watermark {
        position: absolute;
        right: -3rem;
        bottom: -4rem;
        width: 22rem;
        color: var(--cream);
        opacity: 0.05;
        pointer-events: none;
      }

      .card {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 24rem;
        padding: 2rem;
        border-radius: 1.5rem;
        background: var(--cream);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
        text-align: center;
      }

      .logo {
        width: 9rem;
        height: auto;
        margin: 0 auto;
        display: block;
      }

      h1 {
        margin: 0.75rem 0 0;
        font-family: 'Averia Serif Libre', Georgia, serif;
        font-weight: 700;
        font-size: 1.875rem;
        line-height: 2.25rem;
        letter-spacing: -0.025em;
        color: var(--forest);
      }

      .body-text {
        margin: 1rem 0 0;
        font-size: 0.8125rem;
        line-height: 1.25rem;
        color: rgba(0, 69, 35, 0.65);
      }

      .badge {
        display: block;
        margin: 1.5rem auto 0;
        color: var(--forest);
      }

      .badge svg {
        display: block;
        width: 2.5rem;
        height: 2.5rem;
        margin: 0 auto;
      }

      .status {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        margin: 1.5rem 0 0;
        padding: 0.6875rem 0.875rem;
        border: 1px solid rgba(0, 69, 35, 0.18);
        border-radius: 0.375rem;
        font-size: 0.8125rem;
        line-height: 1.125rem;
        color: rgba(0, 69, 35, 0.75);
        text-align: left;
      }

      .spinner {
        display: block;
        width: 0.875rem;
        height: 0.875rem;
        flex-shrink: 0;
        border: 2px solid rgba(0, 69, 35, 0.18);
        border-top-color: var(--green);
        border-radius: 9999px;
        animation: spin 700ms linear infinite;
      }

      button {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        width: 100%;
        margin-top: 1.25rem;
        padding: 0.625rem 1rem;
        border: 0;
        border-radius: 0.5rem;
        background: var(--green);
        color: #fff;
        font-family: inherit;
        font-weight: 700;
        font-size: 1rem;
        line-height: 1.5rem;
        cursor: pointer;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        transition: background-color 150ms ease-out;
      }

      button:active {
        background: var(--forest);
        transform: scale(0.985);
      }

      button[disabled] {
        opacity: 0.6;
        cursor: default;
      }

      button svg {
        width: 1.0625rem;
        height: 1.0625rem;
      }

      button[disabled] svg {
        animation: spin 900ms linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .spinner,
        button[disabled] svg {
          animation: none;
        }
        button:active {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div aria-hidden="true" class="glow glow-lime"></div>
    <div aria-hidden="true" class="glow glow-sky"></div>
    <div aria-hidden="true" class="glow glow-green"></div>

    <svg
      aria-hidden="true"
      class="watermark"
      viewBox="0 0 512 512"
      fill="currentColor"
    >
      <path
        d="M149.9 27.2L34.25 56.74v76.76L157.8 93.85l46.7-44.67-54.6-21.98zm132.8 57c-7.4.18-10.1 1.88.9 7.13C346.9 121.6 441.7 206.8 391.3 216.9 232.2 249 130.4 292.3 48.51 390.8 25.42 418.6 18 494.8 18 494.8h432.6s-139-21.1-147.8-75.7c-14.9-92.2 194.5-102.7 196.5-199.9.9-43.2-88.3-124.99-184.4-132.52-5.6-.44-22.7-2.71-32.2-2.48zm-163.5 40.9l-32.69 10.5v122.2l35.99-10-3.3-122.7z"
      />
    </svg>

    <main class="card">
      <img class="logo" src="logo.png" alt="Canopée" width="260" height="140" />

      <span aria-hidden="true" class="badge">
        <svg viewBox="0 0 32 32" fill="currentColor">
          <path
            d="M26,13a8.9089,8.9089,0,0,1-2.5249,6.2339l1.4133,1.4131A10.9795,10.9795,0,0,0,23.6006,4.2l-1.2012,1.6A8.932,8.932,0,0,1,26,13Z"
          />
          <path
            d="M21,13a5.0022,5.0022,0,0,1-.9023,2.8564l1.4277,1.4278a6.9831,6.9831,0,0,0-.8584-9.5015l-1.334,1.49A5.0077,5.0077,0,0,1,21,13Z"
          />
          <path
            d="M30,28.5859,3.4143,2,2,3.4141l3.71,3.71A10.9824,10.9824,0,0,0,8.3994,21.8008l1.2012-1.6A8.9678,8.9678,0,0,1,7.1714,8.5854l2.1963,2.1963a6.9664,6.9664,0,0,0,1.9648,7.4351l1.334-1.49A5.0072,5.0072,0,0,1,11,13a4.8854,4.8854,0,0,1,.0393-.5464L15,16.4141V30h2V18.4141L28.5857,30Z"
          />
        </svg>
      </span>

      <h1>Connexion indisponible</h1>

      <p class="status">
        <span class="spinner"></span>
        Votre patrouille continue d'être enregistrée.
      </p>

      <button id="retry" type="button">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
          <path
            d="M20 12a8 8 0 1 1-2.34-5.66M20 4v4h-4"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <span id="retry-label">Réessayer</span>
      </button>

      <p class="body-text">
        Impossible de joindre Canopée. Vérifiez votre réseau, puis réessayez.
      </p>
    </main>

    <script>
      ;(function () {
        var button = document.getElementById('retry')
        var label = document.getElementById('retry-label')
        var retrying = false

        function retry() {
          if (retrying) {
            return
          }

          retrying = true
          button.disabled = true
          label.textContent = 'Reconnexion…'

          window.setTimeout(function () {
            window.location.reload()
          }, 250)
        }

        button.addEventListener('click', retry)
        window.addEventListener('online', retry)
      })()
    </script>
  </body>
</html>
